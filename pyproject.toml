[project]
name = "walkout"
version = "0.1.0"
description = "Finds where viewers abandon a title, then works out why"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Google Cloud only. The hackathon rules forbid any non-Google AI model, agent
# framework, or AI API -- that includes LangChain, LangGraph and CrewAI.
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    # ADK's MCP integration and Walkout's own MCP client both need the 1.x
    # protocol library. The ClickHouse MCP *server* needs 2.x, which is why it
    # lives in its own environment -- see `make mcp-server`.
    "mcp>=1.24,<2",
    "clickhouse-connect>=0.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
walkout-simulate = "walkout.cli:simulate"
walkout-load = "walkout.cli:load"
walkout-doctor = "walkout.cli:doctor"
walkout-eval = "walkout.cli:evaluate"
walkout-agent = "walkout.cli:agent"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
walkout = ["../../sql/**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
