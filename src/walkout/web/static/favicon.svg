  <g fill="none" stroke="#FBFBFA" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 7v18h18" stroke-width="2.6" opacity=".55"/>
    <path d="M10.5 19.5 14.5 15.5l3 3 6.5-8" stroke-width="3.2"/>
  </g>
</svg>
